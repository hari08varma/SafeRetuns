name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: returns
          POSTGRES_PASSWORD: returns
          POSTGRES_DB: returns_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U returns" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://returns:returns@localhost:5432/returns_test
    defaults:
      run:
        working-directory: services
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest -q
      - name: Eval suite (smoke, no model)
        env:
          JWT_SECRET: ci-eval-secret-not-used-anywhere-else-000000
          PII_INDEX_KEY: ci-eval-index
        run: |
          export PII_ENCRYPTION_KEY=$(uv run python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())")
          uv run alembic upgrade head
          uv run python -m returns_agent.evals.run --mode smoke --strict --check-bars --out eval-reports
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report
          path: services/eval-reports/
