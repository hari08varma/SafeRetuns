# Happy paths: every resolution type, payment method and evidence path.
# Amounts are paise and worked out by hand from the policy, not from the code.

- id: refund-size-upi
  title: Size problem, prepaid UPI, wants a refund
  tags: [refund, prepaid, demo]
  demo_persona: clear
  order: {sku: KUR-M}
  goal:
    story: The kurta is too tight on the shoulders. I'd like to return it and get my money back.
    reason_category: size_fit
    desired_resolution: refund
  expect:
    outcome: resolved
    resolution: refund
    route: auto
    refund_minor: 129900
    clauses: [RET-DELIVERED-01, RET-WINDOW-01, RET-REFUND-PREPAID-01]

