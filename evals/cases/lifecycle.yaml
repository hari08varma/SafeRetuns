  tags: [escalate, carrier, saga, india]
  order: {sku: KUR-M}
  goal:
    story: The kurta is too small, please exchange it for size L.
    reason_category: size_fit
    desired_resolution: exchange
    exchange_sku: KUR-L
  world: {carrier_events: [pickup_failed, pickup_failed, pickup_failed]}
  expect: {outcome: escalated, resolution: none, route: auto, refund_minor: 0}

