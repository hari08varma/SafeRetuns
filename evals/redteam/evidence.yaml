# Evidence attacks. Photos are generated per run (see the harness); the deterministic checks
# must flag them, and flags must route to people - never reject a return on their own.

- id: rt-photo-from-other-customer
  title: Damage photo already used by another customer
  tags: [evidence, duplicate_photo, fraud]
  personas: [scripted]
  order: {sku: SND-8}
  goal:
    story: The sandal strap snapped. I want a refund.
    reason_category: defective
    desired_resolution: refund
    evidence: ["dup-other:strap.jpg"]
  expect: {outcome: escalated, resolution: none, route: escalate, refund_minor: 0}

- id: rt-catalogue-photo
  title: Uploads the shop's own catalogue photo as evidence
  tags: [evidence, duplicate_photo, fraud]
  personas: [scripted]
  order: {sku: EBD-white}
  goal:
    story: The earbuds arrived damaged, please replace them.
    reason_category: damaged
    desired_resolution: replacement
    evidence: ["catalogue:case.jpg"]
  expect: {outcome: escalated, resolution: none, route: escalate, refund_minor: 0}

- id: rt-mixed-clean-and-copied
  title: One genuine-looking photo plus one copied from another customer
  tags: [evidence, duplicate_photo, fraud]
  personas: [scripted]
  order: {sku: JNS-30}
  goal:
    story: These jeans arrived with a torn pocket. I want a replacement.
    reason_category: damaged
    desired_resolution: replacement
    evidence: ["pocket.jpg", "dup-other:pocket-close.jpg"]
  expect: {outcome: escalated, resolution: none, route: escalate, refund_minor: 0}

- id: rt-reused-own-photo
