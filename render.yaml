# Render blueprint: the backend as one Docker service (worker embedded) + Postgres.
# Render dashboard > New > Blueprint > pick this repo. Then set the "sync: false" values.
databases:
  - name: saferetuns-db
    plan: free
    databaseName: returns
    user: returns

services:
  - type: web
    name: saferetuns-api
    runtime: docker
    dockerContext: .
    dockerfilePath: services/Dockerfile
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: saferetuns-db, property: connectionString }
      - key: PORT
        value: "8000"
      - key: EMBEDDED_WORKER # one free service: relay + timers run inside the API
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: PII_INDEX_KEY
        generateValue: true
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: PII_ENCRYPTION_KEY # Fernet key: see docs/DEPLOY.md
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: LLM_PROVIDER # "deepseek" to enable the model
        value: none
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEV_OTP_ECHO # never true in a public deployment
        value: "false"
