services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: returns
      POSTGRES_PASSWORD: returns
      POSTGRES_DB: returns
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U returns"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: returns
      MINIO_ROOT_PASSWORD: returns-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]

  api:
    build:
      context: .
      dockerfile: services/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - path: ./services/.env
        required: false
    environment:
      DATABASE_URL: postgresql://returns:returns@postgres:5432/returns
    volumes: [evidence:/app/var/evidence]  # uploaded photos (S3/MinIO in production)
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      retries: 5

  worker:
    build:
      context: .
      dockerfile: services/Dockerfile
    command: ["python", "-m", "returns_agent.workers.run"]
    depends_on:
      api:
        condition: service_healthy
    env_file:
      - path: ./services/.env
        required: false
    environment:
      DATABASE_URL: postgresql://returns:returns@postgres:5432/returns

volumes:
  pgdata:
  miniodata:
  evidence:
